common:
  tags:
    - crypto
    - leancrypto
  platform_allow:
    - mps2/an385
    - qemu_cortex_m3
    - nucleo_f429zi
    - stm32f769i_disco
  integration_platforms:
    - mps2/an385
    - qemu_cortex_m3
    - nucleo_f429zi
    - stm32f769i_disco
  harness: ztest
  timeout: 120
  min_ram: 64

tests:
  crypto.leancrypto.ml_kem_768:
    testcases:
      - leancrypto.known_answer
      - leancrypto.random_round_trip
      - leancrypto.random_failure
  crypto.leancrypto.baseline:
    testcases:
      - leancrypto.known_answer
      - leancrypto.random_round_trip
      - leancrypto.random_failure
    extra_configs:
      - CONFIG_LEANCRYPTO=n
      - CONFIG_TEST_LEANCRYPTO_BASELINE=y
  crypto.leancrypto.ml_kem_512:
    testcases:
      - leancrypto.known_answer
      - leancrypto.random_round_trip
      - leancrypto.random_failure
    extra_configs:
      - CONFIG_LEANCRYPTO_ML_KEM_768=n
      - CONFIG_LEANCRYPTO_ML_KEM_512=y
      - CONFIG_TEST_LEANCRYPTO_ML_KEM_512=y
  crypto.leancrypto.ml_kem_1024:
